# ── Spring datasource (tests run against the same local DB) ──────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/thesisdb
spring.datasource.username=bindertsetseg
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# Don't re-run schema.sql during tests (tables already exist)
spring.sql.init.mode=never

# ── App custom properties ──────────────────────────────────────────────────────
app.database.enabled=false
app.messaging.rabbit.enabled=false
app.database.host=localhost
app.database.port=5432
app.database.name=thesisdb
app.database.username=bindertsetseg
app.database.password=
app.database.url=jdbc:postgresql://localhost:5432/thesisdb

# ── Silence RabbitMQ connection attempts during tests ─────────────────────────
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
