spring.application.name=thesis-system
spring.jackson.serialization.indent-output=true
server.port=${SERVER_PORT:8081}

# Spring DataSource (JDBC)
spring.datasource.url=${APP_DATABASE_URL:jdbc:postgresql://localhost:5432/thesisdb}
spring.datasource.username=${APP_DATABASE_USERNAME:bindertsetseg}
spring.datasource.password=${APP_DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never

app.database.enabled=${APP_DATABASE_ENABLED:true}
app.database.host=${APP_DATABASE_HOST:localhost}
app.database.port=${APP_DATABASE_PORT:5432}
app.database.name=${APP_DATABASE_NAME:thesisdb}
app.database.username=${APP_DATABASE_USERNAME:bindertsetseg}
app.database.password=${APP_DATABASE_PASSWORD:}
app.database.url=${APP_DATABASE_URL:jdbc:postgresql://${APP_DATABASE_HOST:localhost}:${APP_DATABASE_PORT:5432}/${APP_DATABASE_NAME:thesisdb}}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}

app.messaging.rabbit.enabled=${APP_MESSAGING_RABBIT_ENABLED:false}
app.messaging.rabbit.exchange=${APP_MESSAGING_RABBIT_EXCHANGE:thesis.workflow.exchange}
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
app.auth.default-password=${APP_AUTH_DEFAULT_PASSWORD:123456}

# Spring Boot Actuator — health & info exposed for Docker/K8s probes.
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_INCLUDE:health,info}
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:when_authorized}
management.endpoint.health.probes.enabled=true

# JWT auth — disabled by default so the prototype keeps working.
# Flip APP_SECURITY_JWT_ENABLED=true in production to require Bearer tokens.
# The secret must match auth-service's jwt.secret (HS256 base64).
app.security.jwt.enabled=${APP_SECURITY_JWT_ENABLED:false}
app.jwt.secret=${APP_JWT_SECRET:YW5kMTIzNDU2Nzg5MGFiY2RlZmdoaWprbG1ub3BxcnN0dXZ3eHl6MTIzNDU2Nzg5MA==}
