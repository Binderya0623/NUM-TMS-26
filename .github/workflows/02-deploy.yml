name: Build & Deploy
run-name: "Deploy | ${{ github.ref_name }} | ${{ github.sha }}"

on:
  push:
    branches: [main]
  workflow_dispatch:   # гараар бүгдийг build+deploy хийх

env:
  REGISTRY: ${{ secrets.DOCKERHUB_USERNAME }}
  VERSION: ${{ github.sha }}

jobs:
  # JOB 1: Ямар service өөрчлөгдсөнийг тодорхойлох
  changes:
    runs-on: ubuntu-latest
    outputs:
      auth_service:         ${{ steps.all.outputs.v || steps.f.outputs.auth_service }}
      user_service:         ${{ steps.all.outputs.v || steps.f.outputs.user_service }}
      topic_service:        ${{ steps.all.outputs.v || steps.f.outputs.topic_service }}
      committee_service:    ${{ steps.all.outputs.v || steps.f.outputs.committee_service }}
      thesis_service:       ${{ steps.all.outputs.v || steps.f.outputs.thesis_service }}
      workflow_service:     ${{ steps.all.outputs.v || steps.f.outputs.workflow_service }}
      evaluation_service:   ${{ steps.all.outputs.v || steps.f.outputs.evaluation_service }}
      notification_service: ${{ steps.all.outputs.v || steps.f.outputs.notification_service }}
      report_service:       ${{ steps.all.outputs.v || steps.f.outputs.report_service }}
      message_service:      ${{ steps.all.outputs.v || steps.f.outputs.message_service }}
      analytic_service:     ${{ steps.all.outputs.v || steps.f.outputs.analytic_service }}
      grading_service:      ${{ steps.all.outputs.v || steps.f.outputs.grading_service }}
      jsf_host:             ${{ steps.all.outputs.v || steps.f.outputs.jsf_host }}
      nginx:                ${{ steps.all.outputs.v || steps.f.outputs.nginx }}
    steps:
      - id: all
        if: github.event_name == 'workflow_dispatch'
        run: echo "v=true" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            auth_service:
              - 'num_auth-main/**'
            user_service:
              - 'user_service/**'
            topic_service:
              - 'topic_service/**'
            committee_service:
              - 'committee_service/**'
            thesis_service:
              - 'thesis_service/**'
            workflow_service:
              - 'workflow_service/**'
            evaluation_service:
              - 'evaluation_service/**'
            notification_service:
              - 'notification_service/**'
            report_service:
              - 'report_service/**'
            message_service:
              - 'message_service/**'
            analytic_service:
              - 'analytic_service/**'
            grading_service:
              - 'grading_service/**'
            nginx:
              - 'infra/nginx/**'
              - 'docker-compose.prod.yml'
            jsf_host:
              - 'module-*/**'
              - 'shared-ui-module/**'
              - 'jsf-host/**'
              - 'Dockerfile.jsf-host'
              - 'Dockerfile.jsf-host.dockerignore'

  # JOB 2: Server дээр config файлуудыг бэлдэх (git clone эсвэл pull)
  setup-server:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_SSH_PASSWORD }}
          script: |
            REPO="https://github.com/Binderya0623/NUM-TMS-26.git"
            DIR="/home/${{ secrets.SERVER_USER }}/diplom"
            if [ ! -d "$DIR/.git" ]; then
              git clone --depth 1 "$REPO" "$DIR"
            else
              git -C "$DIR" pull --ff-only
            fi
            # .env байхгүй бол .env.example-с үүсгэх
            if [ ! -f "$DIR/.env" ]; then
              cp "$DIR/.env.example" "$DIR/.env"
              sed -i 's|http://localhost|http://${{ secrets.SERVER_HOST }}|g' "$DIR/.env"
            fi

  # JOB 3: Backend сервисүүд build + deploy
  deploy-auth:
    needs: [changes, setup-server]
    if: needs.changes.outputs.auth_service == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./num_auth-main/auth-service
          file: ./num_auth-main/auth-service/../../Dockerfile.spring
          push: true
          tags: |
            ${{ env.REGISTRY }}/diploma-auth_service:${{ env.VERSION }}
            ${{ env.REGISTRY }}/diploma-auth_service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_SSH_PASSWORD }}
          script: |
            cd /home/${{ secrets.SERVER_USER }}/diplom
            docker compose -f docker-compose.prod.yml pull auth_service
            docker compose -f docker-compose.prod.yml up -d --no-deps auth_service
            docker image prune -f

