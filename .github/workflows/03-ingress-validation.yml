name: Ingress validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  nginx-validation:
    name: nginx syntax and HTTP routes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Pull configured production Nginx image
        run: docker pull nginx:1.27-alpine

      - name: Validate candidate configuration with nginx -t
        run: |
          docker run --rm --network none \
            -v "$PWD/infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.27-alpine nginx -t

      - name: Test HTTP routes with isolated mock upstreams
        run: bash .github/scripts/validate-ingress.sh

  user-service-tests:
    name: user_service Maven tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: user_service
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d user_service"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_R2DBC_URL: r2dbc:postgresql://localhost:5432/user_service
      SPRING_R2DBC_USERNAME: test_user
      SPRING_R2DBC_PASSWORD: test_password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run Maven tests
        working-directory: user_service
        run: mvn -B test

      - name: Report executed test cases
        if: always()
        working-directory: user_service
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          reports = glob.glob("target/surefire-reports/TEST-*.xml")
          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for report in reports:
              suite = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(suite.attrib.get(key, 0))

          executed = totals["tests"] - totals["skipped"]
          summary = (
              f"user_service Surefire: reports={len(reports)}, "
              f"tests={totals['tests']}, executed={executed}, "
              f"failures={totals['failures']}, errors={totals['errors']}, "
              f"skipped={totals['skipped']}"
          )
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(summary + "\n")
          if executed == 0:
              raise SystemExit("No Maven test cases executed; inspect setup/build logs.")
          PY
