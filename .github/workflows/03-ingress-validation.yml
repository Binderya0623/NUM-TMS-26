name: Ingress validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  nginx-validation:
    name: nginx syntax and HTTP routes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Pull configured production Nginx image
        run: docker pull nginx:1.27-alpine

      - name: Validate candidate configuration with nginx -t
        run: |
          docker run --rm --network none \
            -v "$PWD/infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.27-alpine nginx -t

      - name: Test HTTP routes with isolated mock upstreams
        run: bash .github/scripts/validate-ingress.sh
