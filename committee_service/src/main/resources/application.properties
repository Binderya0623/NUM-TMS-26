spring.application.name=committee_service

# Server
server.port=8082

# PostgreSQL R2DBC
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/committee_service
spring.r2dbc.username=bindertsetseg
spring.r2dbc.password=
spring.r2dbc.pool.initial-size=10
spring.r2dbc.pool.max-size=20

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.properties.spring.json.trusted.packages=*

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Consumer
spring.kafka.consumer.group-id=committee-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=mn.num.edu.committee_service.domain.event.UserCreatedEvent

# Topics
app.kafka.topic.teacher-created=teacher-created
app.kafka.topic.student-created=student-created
app.kafka.topic.committee-created=committee-created
app.kafka.topic.teacher-assigned=committee-teacher-assigned
app.kafka.topic.student-assigned=committee-student-assigned

# Jackson
# Schema auto-initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema_committee_service.sql

spring.jackson.default-property-inclusion=non_null

# Logging
logging.level.root=INFO
logging.level.org.springframework.r2dbc.core=WARN
logging.level.org.springframework.data.r2dbc.core=WARN
logging.level.org.springframework.data.r2dbc=WARN
logging.level.reactor.kafka=WARN
logging.level.org.springframework.kafka=WARN
logging.level.org.apache.kafka=WARN
logging.level.mn.num.edu.committee_service=INFO