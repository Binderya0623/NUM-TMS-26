spring.application.name=thesis_service

# 1. Server Configuration
server.port=${SERVER_PORT:8083}

# 2. R2DBC Database Configuration
spring.r2dbc.url=${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/thesis_service}
spring.r2dbc.username=${SPRING_R2DBC_USERNAME:bindertsetseg}
spring.r2dbc.password=${SPRING_R2DBC_PASSWORD:}
spring.r2dbc.pool.initial-size=${SPRING_R2DBC_POOL_INITIAL_SIZE:10}
spring.r2dbc.pool.max-size=${SPRING_R2DBC_POOL_MAX_SIZE:20}

# 3. Kafka Configuration
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.group-id=thesis-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=mn.num.edu.thesis_service.domain.event
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=mn.num.edu.thesis_service.domain.event.StudentRegisteredEvent

# Topics
kafka.topic.thesis-created=thesis-created
kafka.topic.thesis-updated=thesis-updated
kafka.topic.thesis-approved=thesis-approved
kafka.topic.thesis-rejected=thesis-rejected
kafka.topic.thesis-status-changed=thesis-status-changed
kafka.topic.user-created=user-created-events
kafka.topic.student-assigned=committee-student-assigned

# 4. Jackson
# Schema auto-initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema_thesis_service.sql

spring.jackson.default-property-inclusion=non_null

# Logging
logging.level.root=INFO
logging.level.org.springframework.r2dbc.core=WARN
logging.level.org.springframework.data.r2dbc.core=WARN
logging.level.org.springframework.data.r2dbc=WARN
logging.level.reactor.kafka=WARN
logging.level.org.springframework.kafka=INFO
logging.level.org.apache.kafka=WARN
logging.level.mn.num.edu.thesis_service=INFO
# File upload
app.upload.dir=/tmp/thesis-uploads/reports
spring.codec.max-in-memory-size=10MB

# Spring Boot Actuator — health & info exposed for Docker/K8s probes.
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_INCLUDE:health,info}
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:when_authorized}
management.endpoint.health.probes.enabled=true

# JWT auth — disabled by default so the prototype keeps working.
# Flip APP_SECURITY_JWT_ENABLED=true in production to require Bearer tokens.
# The secret must match auth-service's jwt.secret (HS256 base64).
app.security.jwt.enabled=${APP_SECURITY_JWT_ENABLED:false}
app.jwt.secret=${APP_JWT_SECRET:YW5kMTIzNDU2Nzg5MGFiY2RlZmdoaWprbG1ub3BxcnN0dXZ3eHl6MTIzNDU2Nzg5MA==}
