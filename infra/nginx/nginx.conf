events {
    worker_connections 1024;
}

http {
    # Long timeouts needed for SSE (real-time chat) connections
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Common proxy headers for all blocks
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;

    server {
        listen 80;
        server_name _;

        # SSE: must come before the generic /api/messages/ block.
        # proxy_buffering off is required so EventSource receives events live.
        location /api/messages/stream/ {
            proxy_pass         http://message_service:8089;
            proxy_buffering    off;
            proxy_cache        off;
            proxy_set_header   Host       $host;
            proxy_set_header   Connection '';
            chunked_transfer_encoding off;
        }

        # auth_service
        location /auth {
            proxy_pass http://auth_service:8887;
        }

        # user_service
        location /api/users {
            proxy_pass http://user_service:8086;
        }

        # topic_service  (/api/v2/ covers topics, plans, selection-sessions)
        location /api/v2 {
            proxy_pass http://topic_service:8081;
        }

        # committee_service
        location /api/committee-teachers {
            proxy_pass http://committee_service:8082;
        }
        location /api/reviewer-assignments {
            proxy_pass http://committee_service:8082;
        }
        location /api/committees {
            proxy_pass http://committee_service:8082;
        }

        # thesis_service
        location /api/thesis-reports {
            proxy_pass http://thesis_service:8083;
        }
        location /api/theses {
            proxy_pass http://thesis_service:8083;
        }
        location /api/chat {
            proxy_pass http://thesis_service:8083;
        }

        # workflow_service
        location /api/defense-sessions {
            proxy_pass http://workflow_service:8084;
        }
        location /api/execution-sessions {
            proxy_pass http://workflow_service:8084;
        }
        location /api/workflows {
            proxy_pass http://workflow_service:8084;
        }

        # evaluation_service
        location /api/defense-grades {
            proxy_pass http://evaluation_service:8085;
        }
        location /api/final-grades {
            proxy_pass http://evaluation_service:8085;
        }
        location /api/evaluations {
            proxy_pass http://evaluation_service:8085;
        }
        location /api/review-documents {
            proxy_pass http://evaluation_service:8085;
        }
        location /api/secretary-submissions {
            proxy_pass http://evaluation_service:8085;
        }

        # notification_service
        location /api/notifications {
            proxy_pass http://notification_service:8087;
        }

        # report_service
        location /api/academic-reports {
            proxy_pass http://report_service:8088;
        }

        # message_service (non-stream)
        location /api/messages {
            proxy_pass http://message_service:8089;
        }

        # analytic_service
        location /api/analytics {
            proxy_pass http://analytic_service:8090;
        }

        # grading_service
        location /api/grades {
            proxy_pass http://grading_service:8091;
        }

        # Hospital system
        location /hospital/ {
            proxy_pass http://172.17.0.1:8100;
        }

        # jsf_host: catch-all for UI and static assets
        location / {
            proxy_pass         http://jsf_host:8080;
            proxy_set_header   Host       $host;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }
    }
}
