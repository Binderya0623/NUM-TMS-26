events {
    worker_connections 1024;
}

http {
    # Long timeouts needed for SSE (real-time chat) connections
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Common proxy headers for all blocks
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;

    server {
        listen 80;
        server_name _;

        # Docker embedded DNS — defers upstream resolution to request time
        # so nginx starts even when some services are not yet up.
        resolver 127.0.0.11 valid=10s ipv6=off;

        # Strip trailing slashes from API calls (Spring Boot 3 rejects them).
        location ~ ^(/api/.+)/$ { rewrite ^(.+)/$ $1 last; }

        # SSE: must come before the generic /api/messages/ block.
        # proxy_buffering off is required so EventSource receives events live.
        location /api/messages/stream/ {
            set $svc http://message_service:8089;
            proxy_pass         $svc;
            proxy_buffering    off;
            proxy_cache        off;
            proxy_set_header   Host       $host;
            proxy_set_header   Connection '';
            chunked_transfer_encoding off;
        }

        # auth_service
        location /auth {
            set $svc http://auth_service:8887;
            proxy_pass $svc;
        }

        # user_service
        location /api/users {
            set $svc http://user_service:8086;
            proxy_pass $svc;
        }

        # topic_service  (/api/v2/ covers topics, plans, selection-sessions)
        location /api/v2 {
            set $svc http://topic_service:8081;
            proxy_pass $svc;
        }

        # committee_service
        location /api/committee-teachers {
            set $svc http://committee_service:8082;
            proxy_pass $svc;
        }
        location /api/reviewer-assignments {
            set $svc http://committee_service:8082;
            proxy_pass $svc;
        }
        location /api/committees {
            set $svc http://committee_service:8082;
            proxy_pass $svc;
        }

        # thesis_service
        location /api/thesis-reports {
            set $svc http://thesis_service:8083;
            proxy_pass $svc;
        }
        location /api/theses {
            set $svc http://thesis_service:8083;
            proxy_pass $svc;
        }
        location /api/chat {
            set $svc http://thesis_service:8083;
            proxy_pass $svc;
        }

        # workflow_service
        location /api/defense-sessions {
            set $svc http://workflow_service:8084;
            proxy_pass $svc;
        }
        location /api/execution-sessions {
            set $svc http://workflow_service:8084;
            proxy_pass $svc;
        }
        location /api/workflows {
            set $svc http://workflow_service:8084;
            proxy_pass $svc;
        }

        # evaluation_service
        location /api/defense-grades {
            set $svc http://evaluation_service:8085;
            proxy_pass $svc;
        }
        location /api/final-grades {
            set $svc http://evaluation_service:8085;
            proxy_pass $svc;
        }
        location /api/evaluations {
            set $svc http://evaluation_service:8085;
            proxy_pass $svc;
        }
        location /api/review-documents {
            set $svc http://evaluation_service:8085;
            proxy_pass $svc;
        }
        location /api/secretary-submissions {
            set $svc http://evaluation_service:8085;
            proxy_pass $svc;
        }

        # notification_service
        location /api/notifications {
            set $svc http://notification_service:8087;
            proxy_pass $svc;
        }

        # report_service
        location /api/academic-reports {
            set $svc http://report_service:8088;
            proxy_pass $svc;
        }

        # message_service (non-stream)
        location /api/messages {
            set $svc http://message_service:8089;
            proxy_pass $svc;
        }

        # analytic_service
        location /api/analytics {
            set $svc http://analytic_service:8090;
            proxy_pass $svc;
        }

        # grading_service
        location /api/grades {
            set $svc http://grading_service:8091;
            proxy_pass $svc;
        }

        # Hospital system (direct to host bridge IP)
        location /hospital/ {
            proxy_pass http://172.17.0.1:8100;
        }

        # jsf_host: catch-all for UI and static assets
        location / {
            set $svc http://jsf_host:8080;
            proxy_pass         $svc;
            proxy_set_header   Host       $host;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }
    }
}
