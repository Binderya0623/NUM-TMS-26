server:
  port: 8887
spring:
  application:
    name: auth-service
  main:
    allow-circular-references: true
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/auth_service_db}
    username: ${AUTH_DB_USERNAME:bindertsetseg}
    password: ${AUTH_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  cloud:
    compatibility-verifier:
      enabled: false

eureka:
  client:
    enabled: false
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

jwt:
  secret: YW5kMTIzNDU2Nzg5MGFiY2RlZmdoaWprbG1ub3BxcnN0dXZ3eHl6MTIzNDU2Nzg5MA==
  expiration: 86400000
