server:
  port: 8083

spring:
  application:
    name: user_detail_register
  main:
    allow-circular-references: true
  datasource:
    url: ${USER_DETAIL_DB_URL:jdbc:postgresql://localhost:5432/user_detail_register_db}
    username: ${USER_DETAIL_DB_USERNAME:postgres}
    password: ${USER_DETAIL_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  cloud:
    compatibility-verifier:
      enabled: false
eureka:
  client:
    enabled: false
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/ 
