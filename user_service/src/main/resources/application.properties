spring.application.name=user_service
# 1. Server Configuration
# PORT CHANGED: was 8081 (conflict with topic_service). user_service now owns 8086.
server.port=${SERVER_PORT:8086}

# 2. R2DBC Database Configuration (PostgreSQL Reactive)
spring.r2dbc.url=${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/user_service}
spring.r2dbc.username=${SPRING_R2DBC_USERNAME:bindertsetseg}
spring.r2dbc.password=${SPRING_R2DBC_PASSWORD:}
spring.r2dbc.pool.initial-size=10
spring.r2dbc.pool.max-size=20
logging.level.org.springframework.r2dbc.core=DEBUG
logging.level.org.springframework.data.r2dbc.core=DEBUG
# 3. Kafka Configuration
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Producer ???
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Consumer ???? ???????? ??? (Thesis Service-? ??????? ???????????)
spring.kafka.consumer.group-id=user-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
# JSON mapping ?????? package-??? ????? ?????????
spring.kafka.producer.properties.spring.json.trusted.packages=*
app.kafka.topic.user-created=${APP_KAFKA_TOPIC_USER_CREATED:user-created-events}

# Auth-service integration (used when creating external experts so their login
# credentials land in the auth DB atomically).
app.auth.url=${APP_AUTH_URL:http://localhost:8887}
app.auth.default-password=${APP_AUTH_DEFAULT_PASSWORD:Num2024!}
# 4. Jackson (JSON) Formatting
# Schema auto-initialization (runs schema_user_service.sql on startup)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema_user_service.sql

spring.jackson.default-property-inclusion=non_null

# 5. Logging (Troubleshooting-? ????????)
logging.level.org.springframework.data.r2dbc=DEBUG
logging.level.reactor.kafka=INFO

# Spring Boot Actuator — health & info exposed for Docker/K8s probes.
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_INCLUDE:health,info}
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:when_authorized}
management.endpoint.health.probes.enabled=true

# JWT auth — disabled by default so the prototype keeps working.
# Flip APP_SECURITY_JWT_ENABLED=true in production to require Bearer tokens.
# The secret must match auth-service's jwt.secret (HS256 base64).
app.security.jwt.enabled=${APP_SECURITY_JWT_ENABLED:false}
app.jwt.secret=${APP_JWT_SECRET:YW5kMTIzNDU2Nzg5MGFiY2RlZmdoaWprbG1ub3BxcnN0dXZ3eHl6MTIzNDU2Nzg5MA==}
