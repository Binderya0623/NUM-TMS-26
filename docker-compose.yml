# =============================================================
# docker-compose.yml — Full-stack deployment for the diploma system.
#
# What this brings up:
#   • postgres        14-alpine, 12 databases auto-created
#   • kafka           apache/kafka KRaft (no zookeeper)
#   • auth_service    JWT mint (port 8887)
#   • all 11 backend Spring Boot services (8081–8091)
#   • jsf_host        Tomcat 9 with all MFE bundles baked in (port 8080)
#   • nginx           reverse proxy — single entry point on port 80
#
# Usage:
#   cp .env.example .env       # tune POSTGRES_PASSWORD, APP_JWT_SECRET, ...
#   docker compose up -d --build
#   docker compose logs -f jsf_host
#   ./infra/seed.sh            # populate demo dataset
#   docker compose down -v     # nuke including data volumes
#
# After nginx is up, everything is reachable through port 80:
#   http://SERVER_IP/          → UI (jsf_host)
#   http://SERVER_IP/auth/     → auth_service
#   http://SERVER_IP/api/...   → backend services (routed by path)
# =============================================================
name: diploma-system

x-spring-common: &spring-common
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy
  environment: &spring-env
    SPRING_R2DBC_USERNAME: ${POSTGRES_USER:-postgres}
    SPRING_R2DBC_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
    SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    APP_SECURITY_JWT_ENABLED: ${APP_SECURITY_JWT_ENABLED:-false}
    APP_JWT_SECRET: ${APP_JWT_SECRET:-YW5kMTIzNDU2Nzg5MGFiY2RlZmdoaWprbG1ub3BxcnN0dXZ3eHl6MTIzNDU2Nzg5MA==}
    JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=60.0 -Dspring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}"

services:
  # ───────────────────────────────────────────── infrastructure
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    # Postgres is intentionally NOT exposed to the host.
    # Spring services reach it via Docker's internal network (postgres:5432).
    # To access the DB from your machine: docker compose exec postgres psql -U postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
      - ./infra/postgres/02-thesisdb-schema.sql:/docker-entrypoint-initdb.d/02-thesisdb-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 20s
      retries: 15

  # ───────────────────────────────────────────── auth-service
  # Minted by num_auth-main/auth-service. Issues HS256 JWTs to clients.
  # Backend services validate against the same secret (APP_JWT_SECRET).
  auth_service:
    build:
      context: ./num_auth-main/auth-service
      dockerfile: ../../Dockerfile.spring
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AUTH_DB_URL: jdbc:postgresql://postgres:5432/auth_service_db
      AUTH_DB_USERNAME: ${POSTGRES_USER:-postgres}
      AUTH_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${APP_JWT_SECRET:-YW5kMTIzNDU2Nzg5MGFiY2RlZmdoaWprbG1ub3BxcnN0dXZ3eHl6MTIzNDU2Nzg5MA==}
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=60.0"
    ports: ["${AUTH_PORT:-8887}:8887"]

  # ───────────────────────────────────────── backend services
  user_service:
    <<: *spring-common
    build: { context: ./user_service, dockerfile: ../Dockerfile.spring }
    ports: ["8086:8086"]
    environment:
      <<: *spring-env
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/user_service

  topic_service:
    <<: *spring-common
    build: { context: ./topic_service, dockerfile: ../Dockerfile.spring }
    ports: ["8081:8081"]
    environment:
      <<: *spring-env
      APP_DATABASE_URL: jdbc:postgresql://postgres:5432/thesisdb
      APP_DATABASE_USERNAME: ${POSTGRES_USER:-postgres}
      APP_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

  committee_service:
    <<: *spring-common
    build: { context: ./committee_service, dockerfile: ../Dockerfile.spring }
    ports: ["8082:8082"]
    environment:
      <<: *spring-env
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/committee_service

  thesis_service:
    <<: *spring-common
    build: { context: ./thesis_service, dockerfile: ../Dockerfile.spring }
    ports: ["8083:8083"]
    environment:
      <<: *spring-env
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/thesis_service

  workflow_service:
    <<: *spring-common
    build: { context: ./workflow_service, dockerfile: ../Dockerfile.spring }
    ports: ["8084:8084"]
    environment:
      <<: *spring-env
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/workflow_service

  evaluation_service:
    <<: *spring-common
    build: { context: ./evaluation_service, dockerfile: ../Dockerfile.spring }
    ports: ["8085:8085"]
    environment:
      <<: *spring-env
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/evaluation_service

  notification_service:
    <<: *spring-common
    build: { context: ./notification_service, dockerfile: ../Dockerfile.spring }
    ports: ["8087:8087"]
    environment:
      <<: *spring-env
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/notification_service

  report_service:
    <<: *spring-common
    build: { context: ./report_service, dockerfile: ../Dockerfile.spring }
    ports: ["8088:8088"]
    environment:
      <<: *spring-env
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/report_service

  message_service:
    <<: *spring-common
    build: { context: ./message_service, dockerfile: ../Dockerfile.spring }
    ports: ["8089:8089"]
    environment:
      <<: *spring-env
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/message_service

  analytic_service:
    <<: *spring-common
    build: { context: ./analytic_service, dockerfile: ../Dockerfile.spring }
    ports: ["8090:8090"]
    environment:
      <<: *spring-env
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/analytic_service

  grading_service:
    <<: *spring-common
    build: { context: ./grading_service, dockerfile: ../Dockerfile.spring }
    # grading_service defaults to :8089, but message_service holds 8089.
    # Override to :8091 so the frontend's apiClient (which already points at
    # 8091) keeps working without changes.
    ports: ["8091:8091"]
    environment:
      <<: *spring-env
      SERVER_PORT: 8091
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/grading_service

  # ───────────────────────────────────── JSF host (Tomcat + MFEs)
  # Build-time VITE_API_* args are baked into the bundles. Override per
  # environment in .env to point the frontend at a real public hostname
  # (e.g. VITE_API_USER=https://api.thesis.example.com instead of
  # http://localhost:8086 for non-localhost deploys).
  jsf_host:
    build:
      context: .
      dockerfile: Dockerfile.jsf-host
      args:
        VITE_API_AUTH: ${VITE_API_AUTH:-http://localhost:8887}
        VITE_API_USER: ${VITE_API_USER:-http://localhost:8086}
        VITE_API_TOPIC: ${VITE_API_TOPIC:-http://localhost:8081}
        VITE_API_WORKFLOW: ${VITE_API_WORKFLOW:-http://localhost:8084}
        VITE_API_COMMITTEE: ${VITE_API_COMMITTEE:-http://localhost:8082}
        VITE_API_THESIS: ${VITE_API_THESIS:-http://localhost:8083}
        VITE_API_EVALUATION: ${VITE_API_EVALUATION:-http://localhost:8085}
        VITE_API_NOTIFICATION: ${VITE_API_NOTIFICATION:-http://localhost:8087}
        VITE_API_REPORT: ${VITE_API_REPORT:-http://localhost:8088}
        VITE_API_MESSAGE: ${VITE_API_MESSAGE:-http://localhost:8089}
        VITE_API_ANALYTIC: ${VITE_API_ANALYTIC:-http://localhost:8090}
        VITE_API_GRADING: ${VITE_API_GRADING:-http://localhost:8091}
    restart: unless-stopped
    ports: ["${JSF_HOST_PORT:-8080}:8080"]
    depends_on:
      auth_service: { condition: service_started }
      user_service: { condition: service_started }

  # ───────────────────────────────────────────── nginx gateway
  # Single entry point on port 80. Routes every /api/<prefix> to the
  # matching backend container; everything else falls through to jsf_host.
  # Backend service ports (8081–8091, 8887) are still exposed on the host
  # for local debugging — on a production server you can drop those lines.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-9090}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - jsf_host
      - auth_service
      - user_service
      - topic_service
      - committee_service
      - thesis_service
      - workflow_service
      - evaluation_service
      - notification_service
      - report_service
      - message_service
      - analytic_service
      - grading_service

volumes:
  postgres-data:
  kafka-data:
