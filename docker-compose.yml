# =============================================================
# docker-compose.yml — Local dev stack for the diploma system.
#
# What this brings up:
#   • postgres        14-alpine, 11 databases auto-created
#   • kafka           bitnami/kafka in KRaft mode (no zookeeper)
#   • all 11 backend Spring Boot services
#
# What this does NOT bring up:
#   • React MFEs (run `./build-modules.sh` on the host)
#   • jsf-host (run `cd jsf-host && mvn tomcat7:run` on the host)
#
# Usage:
#   cp .env.example .env       # tune POSTGRES_PASSWORD if you want
#   docker compose up -d       # start everything
#   docker compose logs -f user_service
#   docker compose down -v     # nuke including data volume
# =============================================================
name: diploma-system

x-spring-common: &spring-common
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy
  environment: &spring-env
    SPRING_R2DBC_USERNAME: ${POSTGRES_USER:-postgres}
    SPRING_R2DBC_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
    SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=60.0"

services:
  # ───────────────────────────────────────────── infrastructure
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    # Official Apache image — stable long-lived tags. (bitnami removed 3.7
    # from Docker Hub; see https://hub.docker.com/r/apache/kafka/tags)
    image: apache/kafka:3.7.0
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      # KRaft single-node (broker + controller in one process)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ───────────────────────────────────────── backend services
  user_service:
    <<: *spring-common
    build: { context: ./user_service, dockerfile: ../Dockerfile.spring }
    ports: ["8086:8086"]
    environment:
      <<: *spring-env
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/user_service

  topic_service:
    <<: *spring-common
    build: { context: ./topic_service, dockerfile: ../Dockerfile.spring }
    ports: ["8081:8081"]
    environment:
      <<: *spring-env
      APP_DATABASE_URL: jdbc:postgresql://postgres:5432/thesisdb
      APP_DATABASE_USERNAME: ${POSTGRES_USER:-postgres}
      APP_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

  committee_service:
    <<: *spring-common
    build: { context: ./committee_service, dockerfile: ../Dockerfile.spring }
    ports: ["8082:8082"]
    environment:
      <<: *spring-env
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/committee_service

  thesis_service:
    <<: *spring-common
    build: { context: ./thesis_service, dockerfile: ../Dockerfile.spring }
    ports: ["8083:8083"]
    environment:
      <<: *spring-env
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/thesis_service

  workflow_service:
    <<: *spring-common
    build: { context: ./workflow_service, dockerfile: ../Dockerfile.spring }
    ports: ["8084:8084"]
    environment:
      <<: *spring-env
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/workflow_service

  evaluation_service:
    <<: *spring-common
    build: { context: ./evaluation_service, dockerfile: ../Dockerfile.spring }
    ports: ["8085:8085"]
    environment:
      <<: *spring-env
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/evaluation_service

  notification_service:
    <<: *spring-common
    build: { context: ./notification_service, dockerfile: ../Dockerfile.spring }
    ports: ["8087:8087"]
    environment:
      <<: *spring-env
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/notification_service

  report_service:
    <<: *spring-common
    build: { context: ./report_service, dockerfile: ../Dockerfile.spring }
    ports: ["8088:8088"]
    environment:
      <<: *spring-env
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/report_service

  message_service:
    <<: *spring-common
    build: { context: ./message_service, dockerfile: ../Dockerfile.spring }
    ports: ["8089:8089"]
    environment:
      <<: *spring-env
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/message_service

  analytic_service:
    <<: *spring-common
    build: { context: ./analytic_service, dockerfile: ../Dockerfile.spring }
    ports: ["8090:8090"]
    environment:
      <<: *spring-env
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/analytic_service

  grading_service:
    <<: *spring-common
    build: { context: ./grading_service, dockerfile: ../Dockerfile.spring }
    # grading_service defaults to :8089, but message_service holds 8089.
    # Override to :8091 so the frontend's apiClient (which already points at 8091)
    # keeps working without changes.
    ports: ["8091:8091"]
    environment:
      <<: *spring-env
      SERVER_PORT: 8091
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/grading_service

volumes:
  postgres-data:
  kafka-data:
