# =============================================================
# docker-compose.prod.yml — Server deployment (pulls from Docker Hub)
#
# Usage on server:
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
#   docker compose -f docker-compose.prod.yml logs -f
#   docker compose -f docker-compose.prod.yml down
# =============================================================
name: diploma-system

x-spring-common: &spring-common
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy
  environment: &spring-env
    SPRING_R2DBC_USERNAME: ${POSTGRES_USER:-postgres}
    SPRING_R2DBC_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
    SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    APP_SECURITY_JWT_ENABLED: ${APP_SECURITY_JWT_ENABLED:-false}
    APP_JWT_SECRET: ${APP_JWT_SECRET}
    JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=60.0"

services:
  # ───────────────────────────────────────────── infrastructure
  postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ───────────────────────────────────────────── auth-service
  auth_service:
    image: numthesis/diploma-auth_service:${VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AUTH_DB_URL: jdbc:postgresql://postgres:5432/auth_service_db
      AUTH_DB_USERNAME: ${POSTGRES_USER:-postgres}
      AUTH_DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${APP_JWT_SECRET}
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=60.0"
    ports: ["8887:8887"]

  # ───────────────────────────────────────── backend services
  user_service:
    <<: *spring-common
    image: numthesis/diploma-user_service:${VERSION:-latest}
    ports: ["8086:8086"]
    environment:
      <<: *spring-env
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/user_service

  topic_service:
    <<: *spring-common
    image: numthesis/diploma-topic_service:${VERSION:-latest}
    ports: ["8081:8081"]
    environment:
      <<: *spring-env
      APP_DATABASE_URL: jdbc:postgresql://postgres:5432/thesisdb
      APP_DATABASE_USERNAME: ${POSTGRES_USER:-postgres}
      APP_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_SQL_INIT_MODE: always

  committee_service:
    <<: *spring-common
    image: numthesis/diploma-committee_service:${VERSION:-latest}
    ports: ["8082:8082"]
    environment:
      <<: *spring-env
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/committee_service

  thesis_service:
    <<: *spring-common
    image: numthesis/diploma-thesis_service:${VERSION:-latest}
    ports: ["8083:8083"]
    environment:
      <<: *spring-env
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/thesis_service

  workflow_service:
    <<: *spring-common
    image: numthesis/diploma-workflow_service:${VERSION:-latest}
    ports: ["8084:8084"]
    environment:
      <<: *spring-env
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/workflow_service

  evaluation_service:
    <<: *spring-common
    image: numthesis/diploma-evaluation_service:${VERSION:-latest}
    ports: ["8085:8085"]
    environment:
      <<: *spring-env
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/evaluation_service

  notification_service:
    <<: *spring-common
    image: numthesis/diploma-notification_service:${VERSION:-latest}
    ports: ["8087:8087"]
    environment:
      <<: *spring-env
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/notification_service

  report_service:
    <<: *spring-common
    image: numthesis/diploma-report_service:${VERSION:-latest}
    ports: ["8088:8088"]
    environment:
      <<: *spring-env
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/report_service

  message_service:
    <<: *spring-common
    image: numthesis/diploma-message_service:${VERSION:-latest}
    ports: ["8089:8089"]
    environment:
      <<: *spring-env
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/message_service

  analytic_service:
    <<: *spring-common
    image: numthesis/diploma-analytic_service:${VERSION:-latest}
    ports: ["8090:8090"]
    environment:
      <<: *spring-env
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/analytic_service

  grading_service:
    <<: *spring-common
    image: numthesis/diploma-grading_service:${VERSION:-latest}
    ports: ["8091:8091"]
    environment:
      <<: *spring-env
      SERVER_PORT: 8091
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/grading_service

  # ───────────────────────────────────────── JSF host (Tomcat + MFEs)
  jsf_host:
    image: numthesis/diploma-jsf_host:${VERSION:-latest}
    restart: unless-stopped
    ports: ["8080:8080"]
    depends_on:
      auth_service: { condition: service_started }
      user_service: { condition: service_started }

  # ───────────────────────────────────────────── nginx gateway
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - jsf_host
      - auth_service
      - user_service
      - topic_service
      - committee_service
      - thesis_service
      - workflow_service
      - evaluation_service
      - notification_service
      - report_service
      - message_service
      - analytic_service
      - grading_service

volumes:
  postgres-data:
  kafka-data:
