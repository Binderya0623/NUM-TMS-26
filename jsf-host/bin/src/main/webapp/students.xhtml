<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<ui:composition template="/WEB-INF/templates/layout.xhtml">

    <ui:define name="pageTitle">Оюутны жагсаалт</ui:define>

    <ui:define name="content">
        <div class="microfrontend-page">
            <div class="mf-header">
                <h1>👨‍🎓 Оюутны жагсаалт</h1>
                <div class="mf-info-badge">
                    <span class="badge react-badge">React Микрофронтэнд — Модуль 1</span>
                </div>
            </div>
            <p class="mf-desc">
                Доорх хэсэг нь JSF хуудсанд React аппликэйшн ачаалагдаж буйг харуулна.
                Скрипт нь <code>module1/dist/main.js</code> файлаас татагдан,
                <code>#microfrontend-root</code> DOM элемент дотор зурагдана.
            </p>

            <!-- React microfrontend mount point -->
            <div id="microfrontend-root" class="mf-container">
                <div class="mf-loading">
                    <div class="spinner"></div>
                    <p>React модуль ачааллаж байна...</p>
                </div>
            </div>
        </div>

        <!--
            Асинхрон скрипт ачаалалт:
            index.js нь зөвхөн import('./bootstrap') дуудлагыг агуулна.
            bootstrap.js нь React root үүсгэж, App-ийг render хийнэ.
            Энэ нь Webpack-ийн хамаарлуудыг урьдчилан татах боломжийг олгоно.
        -->
        <script src="${pageContext.request.contextPath}/microfrontends/module1/dist/main.js"
                type="text/javascript">
        </script>
    </ui:define>

</ui:composition>
</html>
