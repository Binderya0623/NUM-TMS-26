<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<ui:composition template="/WEB-INF/templates/layout.xhtml">

    <ui:define name="pageTitle">Сэдэв сонголт</ui:define>

    <ui:define name="content">
        <div class="microfrontend-page">
            <div class="mf-header">
                <h1>🎓 Сэдэв сонголт</h1>
                <div class="mf-info-badge">
                    <span class="badge react-badge">React Микрофронтэнд — Модуль 3</span>
                </div>
            </div>
            <p class="mf-desc">
                Доорх хэсэг нь JSF хуудсанд гурав дахь React аппликэйшн ачаалагдаж буйг харуулна.
                Хянах самбар, нээлттэй сэдвүүдийн жагсаалт, сэдэвтэй танилцах болон хүсэлт илгээх хуудсуудыг агуулна.
            </p>

            <!-- React microfrontend mount point -->
            <div id="microfrontend-root" class="mf-container">
                <div class="mf-loading">
                    <div class="spinner"></div>
                    <p>React модуль ачааллаж байна...</p>
                </div>
            </div>
        </div>

        <!--
            Модуль 3: Сэдэв сонголтын бүрэн flow
            Dashboard → Topics List → Topic Detail → Topic Apply
            React Router-ийн hashRouter биш browserRouter ашигласан тул
            JSF хуудаснаас SPA шиг ажиллана.
        -->
        <script src="${pageContext.request.contextPath}/microfrontends/module3/dist/main.js"
                type="text/javascript">
        </script>
    </ui:define>

</ui:composition>
</html>
