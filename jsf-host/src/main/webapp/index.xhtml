<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html">
<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>МУИС - Дипломын ажлын систем</title>
    <script type="text/javascript">
        // <![CDATA[
        (function() {
            try {
                // authGuard-тай ижил түлхүүр
                var STORAGE_KEY = 'mauth_current_user';
                var rawUser = localStorage.getItem(STORAGE_KEY) || sessionStorage.getItem(STORAGE_KEY);
                
                var contextPath = '#{request.contextPath}';
                
                if (rawUser) {
                    var user = JSON.parse(rawUser);
                    if (user && user.role) {
                        var role = user.role;
                        var targetUrl = contextPath + '/' + role + '.xhtml';
                        window.location.replace(targetUrl);
                        return;
                    }
                }
                
                // Нэвтрээгүй бол login.xhtml рүү
                window.location.replace(contextPath + '/login.xhtml');
            } catch (e) {
                console.error("Redirect error", e);
                window.location.replace('#{request.contextPath}/login.xhtml');
            }
        })();
        // ]]>
    </script>
    <style>
        body { margin: 0; padding: 0; background: #f5f5f5; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; color: #666;}
        .loader { border: 4px solid #e2e8f0; border-top-color: #1455bd; border-radius: 50%; width: 40px; height: 40px; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</h:head>
<h:body>
    <div style="text-align: center;">
        <div class="loader"></div>
        <p>Шилжүүлж байна...</p>
    </div>
</h:body>
</html>
