spring.application.name=workflow_service

server.port=${SERVER_PORT:8084}

spring.r2dbc.url=${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/workflow_service}
spring.r2dbc.username=${SPRING_R2DBC_USERNAME:bindertsetseg}
spring.r2dbc.password=${SPRING_R2DBC_PASSWORD:}
spring.r2dbc.pool.initial-size=${SPRING_R2DBC_POOL_INITIAL_SIZE:10}
spring.r2dbc.pool.max-size=${SPRING_R2DBC_POOL_MAX_SIZE:20}

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# consumer
spring.kafka.consumer.group-id=workflow-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# topics
workflow.topic.created=workflow-created
workflow.topic.stage-created=workflow-stage-created
workflow.topic.stage-activated=workflow-stage-activated
workflow.topic.stage-closed=workflow-stage-closed
workflow.topic.completed=workflow-completed

workflow.topic.thesis-approved=thesis-approved
workflow.topic.committee-created=committee-created
workflow.topic.report-submitted=report-submitted
workflow.topic.evaluation-submitted=evaluation-submitted

# Schema auto-initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema_workflow_service.sql

spring.jackson.default-property-inclusion=non_null

logging.level.root=INFO
logging.level.org.springframework.r2dbc.core=WARN
logging.level.org.springframework.data.r2dbc.core=WARN
logging.level.org.springframework.data.r2dbc=WARN
logging.level.reactor.kafka=WARN
logging.level.org.springframework.kafka=INFO
logging.level.org.apache.kafka=WARN
logging.level.mn.num.edu.workflow_service=INFO
# Spring Boot Actuator — health & info exposed for Docker/K8s probes.
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_INCLUDE:health,info}
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:when_authorized}
management.endpoint.health.probes.enabled=true

# JWT auth — disabled by default so the prototype keeps working.
# Flip APP_SECURITY_JWT_ENABLED=true in production to require Bearer tokens.
# The secret must match auth-service's jwt.secret (HS256 base64).
app.security.jwt.enabled=${APP_SECURITY_JWT_ENABLED:false}
app.jwt.secret=${APP_JWT_SECRET:YW5kMTIzNDU2Nzg5MGFiY2RlZmdoaWprbG1ub3BxcnN0dXZ3eHl6MTIzNDU2Nzg5MA==}
