server.port=${SERVER_PORT:8089}
spring.application.name=message-service
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger

spring.r2dbc.url=${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/message_service}
spring.r2dbc.username=${SPRING_R2DBC_USERNAME:bindertsetseg}
spring.r2dbc.password=${SPRING_R2DBC_PASSWORD:}
spring.r2dbc.pool.initial-size=${SPRING_R2DBC_POOL_INITIAL_SIZE:10}
spring.r2dbc.pool.max-size=${SPRING_R2DBC_POOL_MAX_SIZE:20}
spring.sql.init.mode=always
spring.sql.init.platform=postgres

logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.org.springframework.r2dbc=${LOG_LEVEL_R2DBC:WARN}
logging.level.org.springframework.kafka=${LOG_LEVEL_KAFKA:WARN}

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

app.kafka.topic.message-sent=message-sent
app.kafka.topic.message-seen=message-seen


spring.kafka.producer.acks=all
spring.kafka.producer.retries=3

spring.kafka.consumer.group-id=message-service
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.main.web-application-type=reactive

spring.webflux.base-path=/
# Spring Boot Actuator — health & info exposed for Docker/K8s probes.
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_INCLUDE:health,info}
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:when_authorized}
management.endpoint.health.probes.enabled=true

# JWT auth — disabled by default so the prototype keeps working.
# Flip APP_SECURITY_JWT_ENABLED=true in production to require Bearer tokens.
# The secret must match auth-service's jwt.secret (HS256 base64).
app.security.jwt.enabled=${APP_SECURITY_JWT_ENABLED:false}
app.jwt.secret=${APP_JWT_SECRET:YW5kMTIzNDU2Nzg5MGFiY2RlZmdoaWprbG1ub3BxcnN0dXZ3eHl6MTIzNDU2Nzg5MA==}
