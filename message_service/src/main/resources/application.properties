server.port=8089
spring.application.name=message-service
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger

spring.r2dbc.url=r2dbc:postgresql://localhost:5432/message_service
spring.r2dbc.username=bindertsetseg
spring.r2dbc.password=
spring.r2dbc.pool.initial-size=10
spring.r2dbc.pool.max-size=20
spring.sql.init.mode=always
spring.sql.init.platform=postgres

logging.level.root=INFO
logging.level.org.springframework.r2dbc=DEBUG
logging.level.org.springframework.kafka=DEBUG

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

app.kafka.topic.message-sent=message-sent
app.kafka.topic.message-seen=message-seen


spring.kafka.producer.acks=all
spring.kafka.producer.retries=3

spring.kafka.consumer.group-id=message-service
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.main.web-application-type=reactive

spring.webflux.base-path=/