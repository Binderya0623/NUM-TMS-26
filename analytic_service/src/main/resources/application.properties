spring.application.name=analytic_service

server.port=8090
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger

spring.r2dbc.url=r2dbc:postgresql://localhost:5432/analytic_service
spring.r2dbc.username=bindertsetseg
spring.r2dbc.password=
spring.r2dbc.pool.initial-size=2
spring.r2dbc.pool.max-size=5

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=analytic-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

spring.jackson.default-property-inclusion=non_null

logging.level.root=INFO
logging.level.org.springframework.r2dbc.core=WARN
logging.level.org.springframework.data.r2dbc.core=WARN
logging.level.org.springframework.data.r2dbc=WARN
logging.level.reactor.kafka=WARN
logging.level.org.springframework.kafka=INFO
logging.level.org.apache.kafka=WARN
